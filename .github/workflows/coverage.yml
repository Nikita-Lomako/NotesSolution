name: Code Coverage

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC
  workflow_dispatch: # Manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  coverage:
    name: Detailed Code Coverage Analysis
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: notesdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:latest
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore NotesSolution.sln

    - name: Build solution
      run: dotnet build NotesSolution.sln --no-restore --configuration Release

    - name: Run comprehensive tests with coverage
      run: |
        dotnet test NotesSolution.sln \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage \
          --logger trx \
          --settings coverlet.runsettings
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=notesdb;Username=postgres;Password=${{ secrets.DB_PASSWORD }}"
        ConnectionStrings__RedisConnection: "localhost:6379,password=${{ secrets.REDIS_PASSWORD }}"
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate detailed coverage report
      run: |
        reportgenerator \
          -reports:"coverage/**/coverage.cobertura.xml" \
          -targetdir:"coverage/detailed-report" \
          -reporttypes:"Html;Cobertura;JsonSummary;Badges;TextSummary" \
          -verbosity:Info \
          -historydir:"coverage/history"

    - name: Upload detailed coverage report
      uses: actions/upload-artifact@v4
      with:
        name: detailed-coverage-report
        path: coverage/detailed-report/
        retention-days: 90

    - name: Create coverage badge
      run: |
        COVERAGE=$(cat coverage/detailed-report/Summary.json | jq -r '.summary.linecoverage')
        echo "Coverage: $COVERAGE%"
        
        # Create a simple badge
        COLOR="red"
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="green"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        fi
        
        curl -o coverage-badge.svg "https://img.shields.io/badge/coverage-$COVERAGE%25-$COLOR"

    - name: Upload coverage badge
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: coverage-badge.svg
        retention-days: 90
